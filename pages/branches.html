<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Branches — Geresu Dhuki SACCO</title>
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<script>
(function preTheme(){try{const t=localStorage.getItem("sacco.theme")||"light";if(t==="dark")document.documentElement.classList.add("theme-dark");else if(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.classList.add("theme-dark");const l=localStorage.getItem("sacco.lang")||"en";document.documentElement.setAttribute("lang",l);if(l==="am")document.documentElement.setAttribute("data-ethiopic","true");}catch(e){}})();
</script>

<script type="importmap">
{
  "imports": {
    "firebase/app":       "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
    "firebase/auth":      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
  }
}
</script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#0b5cab;--primary-dark:#073d75;--secondary:#0e7490;
  --gold:#d4a845;--gold-light:#f0d68a;--gold-dark:#b8922f;
  --text:#172033;--text-soft:#344054;--muted:#6b7280;--muted-light:#98a2b3;
  --border:#e5e7eb;--border-soft:#eef1f5;
  --danger:#dc2626;--success:#067647;--warning:#b8860b;
  --info:#2196f3;
  --bg:#f4f7fb;--bg-soft:#fbfcfe;
  --violet:#5b21b6;--violet-soft:#f0eaff;
  --sh-sm:0 1px 2px rgba(20,40,70,.04),0 1px 3px rgba(20,40,70,.06);
  --sh-md:0 4px 12px rgba(20,40,70,.06),0 2px 4px rgba(20,40,70,.04);
  --sh-lg:0 12px 32px rgba(20,40,70,.08),0 4px 8px rgba(20,40,70,.04);
  --r-md:13px;--r-lg:20px;--r-full:999px;
  --sidebar-w:272px;--topbar-h:76px;
}
html.theme-dark,body.theme-dark{
  --text:#e4e8f0;--text-soft:#c5cdd9;--muted:#94a3b8;--muted-light:#64748b;
  --border:#1e293b;--border-soft:#1a2433;
  --bg:#0b1220;--bg-soft:#111a2c;color-scheme:dark;
}
html,body{height:100%;}
body{font-family:"Inter","Noto Sans Ethiopic",system-ui,sans-serif;
  background:radial-gradient(circle at 10% 20%,rgba(11,92,171,.09),transparent 35%),
             radial-gradient(circle at 90% 80%,rgba(25,169,116,.09),transparent 35%),var(--bg);
  color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
html.theme-dark body{background:radial-gradient(circle at 10% 20%,rgba(11,92,171,.14),transparent 35%),radial-gradient(circle at 90% 80%,rgba(25,169,116,.14),transparent 35%),var(--bg);}
body.lang-am{font-family:"Noto Sans Ethiopic","Inter",sans-serif;}
img,svg{display:block;max-width:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{line-height:1.25;letter-spacing:-.02em;font-weight:800;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px;}
.hidden{display:none !important;}
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9999;transition:opacity .3s;}
#loader.hide{opacity:0;pointer-events:none;}
.spin{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"sidebar topbar" "sidebar main";min-height:100vh;
  transition:grid-template-columns .25s cubic-bezier(.4,0,.2,1);}
body.sidebar-collapsed .app{grid-template-columns:88px 1fr;}

/* ============ SIDEBAR ============ */
.sidebar{grid-area:sidebar;position:sticky;top:0;height:100vh;width:var(--sidebar-w);
  background:linear-gradient(145deg,#073d75 0%,#0b5cab 55%,#0e7490 100%);
  color:#fff;display:flex;flex-direction:column;overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1);z-index:30;}
body.sidebar-collapsed .sidebar{width:88px;}
html.theme-dark .sidebar{background:linear-gradient(145deg,#0b1220,#0f172a,#111a2c);}
.sidebar__brand{position:relative;display:flex;align-items:center;gap:14px;
  padding:22px;border-bottom:1px solid rgba(255,255,255,.10);
  min-height:var(--topbar-h);flex-shrink:0;}
.sidebar__logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.97);
  display:grid;place-items:center;padding:5px;overflow:hidden;flex-shrink:0;}
.sidebar__logo img,.sidebar__logo svg{width:100%;height:100%;object-fit:contain;border-radius:9px;}
.sidebar__identity{min-width:0;flex:1;transition:opacity .18s;white-space:nowrap;overflow:hidden;}
body.sidebar-collapsed .sidebar__identity{opacity:0;pointer-events:none;}
.sidebar__title{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.sidebar__title .sacco-gold{color:#f0d68a;}
.sidebar__subtitle{font-size:11px;opacity:.72;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar__collapse{position:absolute;right:-13px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;background:#fff;color:var(--primary-dark);
  border:3px solid var(--bg);display:grid;place-items:center;cursor:pointer;z-index:10;}
.sidebar__collapse i{font-size:10px;transition:transform .25s;}
body.sidebar-collapsed .sidebar__collapse i{transform:rotate(180deg);}
.sidebar__nav{flex:1;padding:20px 14px;overflow-y:auto;overflow-x:hidden;}
.sidebar__nav::-webkit-scrollbar{width:4px;}
.sidebar__nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px;}
.sidebar__section{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.45);padding:18px 12px 8px;white-space:nowrap;overflow:hidden;transition:all .2s ease;}
body.sidebar-collapsed .sidebar__section{height:6px;padding:0;opacity:0;margin-top:14px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:12px;
  font-size:14px;font-weight:600;color:rgba(255,255,255,.78);
  margin-bottom:3px;white-space:nowrap;cursor:pointer;position:relative;transition:.15s;}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff;}
.nav-item.is-active{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.nav-item.is-active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:4px;height:24px;border-radius:0 4px 4px 0;background:#58e6a7;box-shadow:0 0 12px rgba(88,230,167,.6);}
.nav-item i{width:20px;font-size:15px;text-align:center;flex-shrink:0;}
.nav-item__label{flex:1;overflow:hidden;text-overflow:ellipsis;}
body.sidebar-collapsed .nav-item__label{opacity:0;pointer-events:none;}
body.sidebar-collapsed .nav-item{justify-content:center;padding:12px;}
body.sidebar-collapsed .nav-item:hover::after{content:attr(data-tooltip);
  position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);
  background:var(--text);color:#fff;padding:7px 12px;border-radius:8px;
  font-size:12px;font-weight:600;white-space:nowrap;
  box-shadow:0 10px 24px rgba(20,40,70,.2);z-index:100;pointer-events:none;}
body.sidebar-collapsed .nav-item.is-active::before{left:0;height:28px;}
.sidebar__footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.10);flex-shrink:0;}
.sidebar__logout{display:flex;align-items:center;gap:12px;width:100%;padding:10px 13px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;
  color:rgba(255,255,255,.9);font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap;}
.sidebar__logout i{width:20px;text-align:center;}
.sidebar__logout:hover{background:rgba(220,60,60,.25);border-color:rgba(220,60,60,.5);color:#ff8a8a;}
body.sidebar-collapsed .sidebar__logout{justify-content:center;padding:12px;}
body.sidebar-collapsed .sidebar__logout span{display:none;}

/* ============ TOPBAR ============ */
.topbar{grid-area:topbar;background:rgba(255,255,255,.85);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:20;}
html.theme-dark .topbar{background:rgba(15,23,42,.85);border-bottom-color:#1e293b;}
.topbar__menu{display:none;width:42px;height:42px;border-radius:12px;color:var(--text);
  align-items:center;justify-content:center;cursor:pointer;}
.topbar__menu:hover{background:var(--border-soft);}
.topbar__spacer{flex:1;}
.topbar__actions{display:flex;align-items:center;gap:8px;}
.lang-toggle{display:flex;gap:2px;padding:3px;border-radius:var(--r-full);background:#f1f4f8;margin-right:6px;}
html.theme-dark .lang-toggle{background:#1a2433;}
.lang-toggle button{padding:6px 12px;border-radius:var(--r-full);font-size:11px;font-weight:800;
  color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.04em;}
.lang-toggle button:hover{color:var(--primary);}
.lang-toggle button.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 10px rgba(11,92,171,.25);}
.user-btn{display:flex;align-items:center;gap:11px;padding:4px 14px 4px 4px;
  border-radius:var(--r-full);background:var(--border-soft);cursor:pointer;transition:background .15s;position:relative;}
.user-btn:hover{background:#e4e9f1;}
html.theme-dark .user-btn{background:#1a2433;}
.user-btn__avatar{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;overflow:hidden;position:relative;}
.user-btn__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.user-btn__name{font-size:13px;font-weight:700;display:block;color:var(--text);white-space:nowrap;}
.user-btn__role{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;}
.dropdown__panel{position:absolute;right:0;top:calc(100% + 12px);background:#fff;
  border:1px solid var(--border);border-radius:16px;
  box-shadow:0 30px 60px rgba(20,40,70,.12);min-width:260px;padding:8px;z-index:50;}
html.theme-dark .dropdown__panel{background:#0f172a;border-color:#1e293b;}
.dropdown__header{padding:12px 14px;border-bottom:1px solid var(--border-soft);margin-bottom:6px;}
.dropdown__header strong{display:block;font-size:14px;font-weight:700;color:var(--text);}
.dropdown__header span{font-size:12px;color:var(--muted);}
.dropdown__item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;
  border-radius:10px;font-size:14px;font-weight:500;color:var(--text-soft);
  text-align:left;cursor:pointer;transition:background .15s;}
.dropdown__item:hover{background:var(--border-soft);color:var(--text);}
.dropdown__item i{width:17px;font-size:14px;text-align:center;}
.dropdown__item--danger{color:var(--danger);}

/* ============ MAIN ============ */
.main{grid-area:main;padding:32px;overflow-x:hidden;min-width:0;}
html.theme-dark .main{background:#0b1220;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
.page-head__title{font-size:32px;font-weight:800;letter-spacing:-1.2px;margin-bottom:6px;}
.page-head__sub{font-size:15px;color:var(--muted);}
.page-head__actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.breadcrumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 20px;margin-bottom:22px;box-shadow:var(--sh-sm);font-size:13px;font-weight:700;}
html.theme-dark .breadcrumb{background:#0f172a;border-color:#1e293b;}
.breadcrumb span.crumb{padding:6px 13px;border-radius:999px;background:var(--border-soft);color:var(--text-soft);}
.breadcrumb span.crumb.is-active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
.breadcrumb span.crumb.is-link{cursor:pointer;}
.breadcrumb span.crumb.is-link:hover{background:#dbeafe;color:var(--primary);}
.breadcrumb span.arrow{color:#cbd5e1;font-weight:400;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px;}
.stat{position:relative;background:#fff;border:1px solid var(--border);
  border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s;}
html.theme-dark .stat{background:#0f172a;border-color:#1e293b;}
.stat:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--c1,var(--primary));border-radius:var(--r-lg) var(--r-lg) 0 0;}
.stat--blue  {--c1:linear-gradient(90deg,#0b5cab,#0e7490);--ic:#eaf3fc;--ifc:#0b5cab;}
.stat--green {--c1:linear-gradient(90deg,#19a974,#34c78e);--ic:#e7f7f0;--ifc:#128a5c;}
.stat--gold  {--c1:linear-gradient(90deg,#d4a017,#e8b84b);--ic:#fdf5e0;--ifc:#b8860b;}
.stat--violet{--c1:linear-gradient(90deg,#7c3aed,#a78bfa);--ic:#f0eaff;--ifc:#6d28d9;}
.stat--teal  {--c1:linear-gradient(90deg,#0e7490,#4dd4c4);--ic:#e0f5f7;--ifc:#0e7490;}
.stat__head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
.stat__label{font-size:11.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
.stat__icon{width:42px;height:42px;border-radius:12px;background:var(--ic);color:var(--ifc);
  display:grid;place-items:center;flex-shrink:0;font-size:16px;}
.stat__value{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.1;color:var(--text);}
.stat__hint{font-size:11.5px;color:var(--muted);margin-top:6px;}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh-sm);overflow:hidden;}
html.theme-dark .card{background:#0f172a;border-color:#1e293b;}
.card__head{display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--border-soft);gap:16px;flex-wrap:wrap;}
html.theme-dark .card__head{border-bottom-color:#1e293b;}
.card__title{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--text);}
.card__sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:600;}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 24px;
  border-bottom:1px solid var(--border-soft);background:var(--bg-soft);}
html.theme-dark .toolbar{background:#111a2c;border-bottom-color:#1e293b;}
.toolbar__search{position:relative;flex:1;min-width:200px;max-width:320px;}
.toolbar__search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.toolbar__search input{width:100%;height:42px;padding:0 14px 0 38px;border:1px solid var(--border);
  border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;transition:.15s;}
html.theme-dark .toolbar__search input{background:#1a2433;color:#e4e8f0;border-color:#1e293b;}
.toolbar__search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,92,171,.10);}
.toolbar select{height:42px;padding:0 14px;border:1px solid var(--border);border-radius:11px;
  background:#fff;font-size:13px;font-weight:700;color:var(--text-soft);cursor:pointer;min-width:160px;font-family:inherit;}
html.theme-dark .toolbar select{background:#1a2433;color:#e4e8f0;border-color:#1e293b;}
.toolbar select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,92,171,.10);}
.toolbar__right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.view-toggle{display:flex;gap:2px;padding:3px;border-radius:11px;background:#e8ecf1;}
html.theme-dark .view-toggle{background:#1a2433;}
.view-toggle button{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:800;
  color:var(--muted);cursor:pointer;transition:.15s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.view-toggle button:hover{color:var(--primary);}
.view-toggle button.is-active{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(20,40,70,.08);}
html.theme-dark .view-toggle button.is-active{background:#0f172a;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:46px;padding:0 20px;border-radius:13px;
  border:1px solid #d9dee7;background:#fff;color:var(--text-soft);
  font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all .15s;}
html.theme-dark .btn{background:#0f172a;border-color:#1e293b;color:#c5cdd9;}
.btn:hover{background:var(--bg-soft);border-color:#b9c7d9;}
.btn i{font-size:14px;}
.btn--primary{background:linear-gradient(135deg,#0b5cab,#0e7490);border:none;color:#fff;
  box-shadow:0 10px 22px rgba(11,92,171,.22);}
.btn--primary:hover{background:linear-gradient(135deg,#073d75,#0b5cab);}
.btn--danger{background:linear-gradient(135deg,#dc2626,#b42318);border:none;color:#fff;
  box-shadow:0 10px 22px rgba(220,38,38,.2);}
.btn--sm{height:42px;padding:0 16px;font-size:13px;border-radius:11px;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.branches-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:22px;}
.branch-card{position:relative;background:#fff;border:1px solid var(--border);
  border-radius:16px;padding:20px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s;}
html.theme-dark .branch-card{background:#0f172a;border-color:#1e293b;}
.branch-card:hover{box-shadow:var(--sh-lg);transform:translateY(-3px);border-color:#a8dde4;}
.branch-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#0e7490,#4dd4c4);}
.branch-card__head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;}
.branch-card__icon{width:52px;height:52px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,#e0f5f7,#c4ecf0);color:#0e7490;
  display:grid;place-items:center;font-size:22px;}
.branch-card__main{flex:1;min-width:0;}
.branch-card__code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:800;
  letter-spacing:.6px;color:#0e7490;background:#e0f5f7;padding:3px 9px;border-radius:6px;
  display:inline-block;margin-bottom:6px;}
.branch-card__name{font-size:17px;font-weight:800;line-height:1.25;word-break:break-word;color:var(--text);}
.branch-card__district{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#0b5cab;
  font-weight:800;margin-top:6px;background:#eaf3fc;padding:4px 10px;border-radius:var(--r-full);}
.branch-card__actions{position:absolute;top:16px;right:16px;display:flex;gap:4px;opacity:0;transition:.15s;}
.branch-card:hover .branch-card__actions{opacity:1;}
.branch-card__actions button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-size:12px;color:var(--text-soft);background:#fff;border:1px solid var(--border);transition:.15s;}
html.theme-dark .branch-card__actions button{background:#0f172a;border-color:#1e293b;color:#c5cdd9;}
.branch-card__actions button:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.branch-card__actions button.danger:hover{background:var(--danger);border-color:var(--danger);}
.branch-card__stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  padding-top:14px;border-top:1px solid var(--border-soft);}
.mini-stat{display:flex;align-items:center;gap:10px;}
.mini-stat__icon{width:34px;height:34px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;font-size:13px;}
.mini-stat__icon--customer{background:#e7f7f0;color:#128a5c;}
.mini-stat__icon--savings{background:#eaf3fc;color:#0b5cab;}
.mini-stat__value{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1;color:var(--text);}
.mini-stat__value--sm{font-size:13.5px;}
.mini-stat__label{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;margin-top:3px;}
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;min-width:820px;}

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signOut, onAuthStateChanged } from "firebase/auth";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, onSnapshot, query, orderBy, serverTimestamp,
  getDocs, where, limit
} from "firebase/firestore";

/* ============================================================ FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBeQv8YLNfFFaTEZ6pxXaAy_K8n3u8V5X4",
  authDomain: "geresu-dhuki-sacco-75329.firebaseapp.com",
  projectId: "geresu-dhuki-sacco-75329",
  storageBucket: "geresu-dhuki-sacco-75329.firebasestorage.app",
  messagingSenderId: "431325504753",
  appId: "1:431325504753:web:f7289fb88d74b82eb0b550"
};
const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);
const db    = getFirestore(fbApp);
const LOGIN_URL = "../index.html";
const LOGO_URL  = "../images/logo.png";
const DEFAULT_SACCO_NAME = 'GERESU DHUKI SACCO';

/* ============================================================ SESSION (silent) */
const SESSION_KEY = "sacco.session";
const DEFAULT_SESSION_MINUTES = 30;
let SESSION_MINUTES = DEFAULT_SESSION_MINUTES;
let awayStartedAt = null, awayCheckInterval = null;

function readSession() { try { const r = sessionStorage.getItem(SESSION_KEY); if (!r) return null; const s = JSON.parse(r); return (s && s.uid) ? s : null; } catch (e) { return null; } }
function clearSession() { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function isSessionRecordValid(s) { return !!(s && s.uid); }
function getSessionMs() { const s = readSession(); const m = (s && s.minutes) || SESSION_MINUTES; return Math.max(1, m) * 60000; }
function forceLogout(reason) {
  if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; }
  awayStartedAt = null;
  try { sessionStorage.clear(); sessionStorage.setItem('__redirectReason', reason || 'expired'); } catch (e) {}
  clearSession();
  try { signOut(auth); } catch (e) {}
  window.location.replace(LOGIN_URL);
}
function isWindowActive() { return document.visibilityState === 'visible' && document.hasFocus(); }
function startAwayTimer() {
  if (awayStartedAt) return;
  awayStartedAt = Date.now();
  if (awayCheckInterval) clearInterval(awayCheckInterval);
  awayCheckInterval = setInterval(() => {
    if (!awayStartedAt) return;
    if (Date.now() - awayStartedAt >= getSessionMs()) { forceLogout('expired'); return; }
  }, 1000);
}
function stopAwayTimer() { awayStartedAt = null; if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; } }
function evaluateActivity() { if (isWindowActive()) stopAwayTimer(); else startAwayTimer(); }
function startSessionWatcher() {
  document.addEventListener('visibilitychange', evaluateActivity);
  window.addEventListener('focus', evaluateActivity);
  window.addEventListener('blur', evaluateActivity);
  evaluateActivity();
}
async function loadSessionTimeout() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'system'));
    if (snap.exists()) {
      const data = snap.data();
      let mins = DEFAULT_SESSION_MINUTES;
      if (data.sessionTimeout != null) mins = Number(data.sessionTimeout);
      else if (data.sessionTimeoutMinutes != null) mins = Number(data.sessionTimeoutMinutes);
      if (!isFinite(mins) || mins < 1) mins = DEFAULT_SESSION_MINUTES;
      if (mins > 1440) mins = 1440;
      SESSION_MINUTES = Math.round(mins);
    }
  } catch (e) { console.warn(e.message); }
}

/* ============================================================ STATE */
const APP = {
  user: null, profile: null,
  saccoName: DEFAULT_SACCO_NAME, shortName: 'GDS',
  districts: [], branches: [], customers: [], transactions: [],
  unsubs: [],
  filters: { search: '', district: '' },
  view: 'grid', page: 1, pageSize: 12,
  editingId: null, deletingId: null
};
let LANG = 'en';

/* ============================================================ TRANSLATIONS */
const I18N = {
  en: {
    brandSub:'SACCO Management',
    navOverview:'Overview', navNetwork:'Network', navOperations:'Operations', navFinance:'Finance', navAdmin:'Administration',
    dashboard:'Dashboard', districts:'Districts', branches:'Branches', customers:'Customers',
    savings:'Savings', deposits:'Deposits', loans:'Loans', repayments:'Repayments',
    withdrawals:'Withdrawals', dividends:'Dividends', shares:'Shares', reports:'Reports',
    penalties:'Penalties', audit:'Audit Trail', users:'Users', settings:'Settings',
    role_super_admin:'Super Admin', role_admin:'Admin', role_manager:'Manager',
    role_cashier:'Cashier', role_member:'Member', role_auditor:'Auditor', logout:'Sign out',
    pageTitle:'Branches', pageSub:'Manage branches across all districts',
    breadcrumbHome:'Dashboard', breadcrumbDistricts:'Districts', breadcrumbBranches:'Branches',
    addBranch:'Add Branch',
    statTotal:'Total Branches', statDistricts:'Districts Covered',
    statCustomers:'Total Customers', statAvgCustomers:'Avg Customers / Branch',
    searchPlaceholder:'Search by name or code…', filterAllDistricts:'All districts',
    viewGrid:'Grid', viewTable:'Table',
    tableTitle:'All Branches', tableSub:'Branch list across districts',
    colCode:'Code', colName:'Branch', colDistrict:'District',
    colCustomers:'Customers', colCreated:'Created', colActions:'Actions',
    gridCustomers:'Customers', gridSavings:'Total Savings',
    noBranches:'No branches yet', noBranchesText:'Click "Add Branch" to create the first one.',
    noMatch:'No matching branches', noMatchText:'Try adjusting your search or filters.',
    editBranch:'Edit Branch', newBranch:'New Branch',
    editBranchSub:"Update this branch's details.",
    newBranchSub:'Create a new branch and assign it to a district.',
    nameLabel:'Branch Name', nameHint:'The official name of the branch.',
    codeLabel:'Branch Code', codeHint:'Short unique code (e.g. BR-001).',
    districtLabel:'Parent District', districtHint:'The district this branch belongs to.',
    chooseDistrict:'Choose a district…',
    notesLabel:'Notes', notesHint:'Optional. Any additional information about this branch.',
    namePlaceholder:'e.g. Adama Branch', codePlaceholder:'e.g. BR-001', notesPlaceholder:'Optional notes…',
    cancel:'Cancel', save:'Save', create:'Create Branch', update:'Update',
    deleteTitle:'Delete Branch', deleteText:'This will permanently remove this branch from Firestore.',
    confirm:'Confirm', rowDelete:'Delete', rowEdit:'Edit', reset:'Reset',
    showing:'Showing', of:'of', branchesWord:'branches',
    savedOk:'Branch saved successfully!', createdOk:'Branch created successfully!', deletedOk:'Branch deleted.',
    errorSave:'Could not save: ', errorDelete:'Could not delete: ',
    requiredFields:'Please fill in all required fields.',
    duplicateCode:'A branch with this code already exists.',
    noDistrictSelected:'Please choose a parent district.',
    hasCustomersWarning:'This branch has {n} customer(s). Deleting will not remove them.',
    cannotDeleteText:'Delete is blocked because this branch still has customers. Reassign or remove them first.',
    forceDeleteLabel:'I understand this will orphan {n} customer(s). Delete anyway.',
    loading:'Loading…',
    logoutTitle:'Logout Confirmation', logoutText:'Are you sure you want to log out?',
    accessDenied:'You do not have permission to view this page.',
    accessDeniedText:'Only Super Admins, Admins, Managers, Cashiers and Auditors can view branches.',
    backToDashboard:'Back to Dashboard',
    noPermission:'Permission denied. Check your Firestore rules.',
    scopeAll:'All branches', scopeDistrict:'Your district', scopeBranch:'Your branch'
  }
};
I18N.am = { ...I18N.en };
I18N.om = { ...I18N.en };

const SUPPORTED = ['en','am','om'];
const FALLBACK = 'en';
const LANG_KEY = 'sacco.lang';
const t = (k, v) => {
  let s = (I18N[LANG] && I18N[LANG][k]) || I18N[FALLBACK][k] || k;
  if (v) Object.keys(v).forEach(x => { s = s.replace('{'+x+'}', v[x]); });
  return s;
};

/* ============================================================ HELPERS */
const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = (n) => (n || '?').trim().split(/\s+/).slice(0,2).map(s => s[0]).join('').toUpperCase();
const num = (v) => { const n = Number(v); return isFinite(n) ? n : 0; };
const moneyShort = (v) => {
  const n = num(v);
  if (!n) return 'ETB 0';
  if (n >= 1e9) return 'ETB ' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return 'ETB ' + (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return 'ETB ' + (n/1e3).toFixed(1) + 'K';
  return 'ETB ' + n.toLocaleString();
};
const toDate = (v) => {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v.toDate === 'function') { try { return v.toDate(); } catch(e){} }
  if (typeof v === 'object' && v.seconds != null) return new Date(v.seconds * 1000);
  if (typeof v === 'number') return new Date(v);
  const d = new Date(v);
  return isNaN(d) ? null : d;
};
const fmtDate = (v) => { const d = toDate(v); if (!d) return '—'; return d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }); };

function toast(msg, type = 'success') {
  const wrap = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast toast--' + type;
  const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', warning:'fa-exclamation-triangle' };
  el.innerHTML = `<i class="fas ${icons[type] || 'fa-info-circle'}"></i><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3800);
  setTimeout(() => el.remove(), 4200);
}
const LOGO_FALLBACK = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0b5cab"/><circle cx="50" cy="47" r="25" fill="none" stroke="#f0c96a" stroke-width="3.5"/><text x="50" y="59" font-family="Georgia,serif" font-size="30" font-weight="900" fill="#f0c96a" text-anchor="middle">G</text></svg>`;
const LOGO_HTML = `<img src="${LOGO_URL}" alt="SACCO" onerror="this.onerror=null; this.outerHTML=this.dataset.fallback;" data-fallback="${LOGO_FALLBACK.replace(/"/g, '&quot;')}">`;

function renderBrandTitle(name){
  const raw = (name && String(name).trim()) ? String(name).trim() : DEFAULT_SACCO_NAME;
  const words = raw.split(/\s+/);
  if (words.length < 2) return esc(raw);
  const tail = words.pop();
  const head = words.join(' ');
  return esc(head) + ' <span class="sacco-gold">' + esc(tail) + '</span>';
}

/* ============================================================ ROLES + ACCESS */
const ROLES = { super_admin:'role_super_admin', admin:'role_admin', manager:'role_manager', cashier:'role_cashier', auditor:'role_auditor', member:'role_member' };
const roleLabel = (r) => ROLES[r] ? t(ROLES[r]) : (r || '').replace(/_/g,' ');
const isSuper    = () => APP.profile?.role === 'super_admin';
const isAdmin    = () => APP.profile?.role === 'admin';
const isManager  = () => APP.profile?.role === 'manager';
const isCashier  = () => APP.profile?.role === 'cashier';
const isAuditor  = () => APP.profile?.role === 'auditor';
const canView    = () => isSuper() || isAdmin() || isAuditor() || isManager() || isCashier();
const canEdit    = () => isSuper() || isAdmin();

function _matchesDistrict(rec, district) {
  if (!rec || !district) return false;
  const keys = [district.id, district.code, district.name].filter(Boolean);
  if (!keys.length) return false;
  return keys.includes(rec.districtId)
      || keys.includes(rec.districtCode)
      || keys.includes(rec.district);
}
function _matchesBranch(rec, branch) {
  if (!rec || !branch) return false;
  const keys = [branch.id, branch.code, branch.name].filter(Boolean);
  if (!keys.length) return false;
  return keys.includes(rec.branchId)
      || keys.includes(rec.branchCode)
      || keys.includes(rec.branch);
}

function assignableDistricts() {
  if (isSuper()) return APP.districts.slice();
  if (isAdmin()) {
    const p = APP.profile || {};
    const target = p.districtId || p.districtCode || p.districtName;
    if (!target) return [];
    return APP.districts.filter(d =>
      d.id === target || d.code === target || d.name === target
    );
  }
  return [];
}
function filterableDistricts() {
  if (isSuper() || isAuditor()) return APP.districts.slice();
  if (isAdmin()) return assignableDistricts();
  if (isManager() || isCashier()) {
    const bId = APP.profile.branchId;
    const b = APP.branches.find(x => x.id === bId);
    if (!b) return [];
    return APP.districts.filter(d => _matchesDistrict(b, d));
  }
  return [];
}

function scopeBranches() {
  if (isSuper() || isAuditor()) return APP.branches.slice();
  if (isAdmin()) {
    const okDistricts = assignableDistricts();
    return APP.branches.filter(b => okDistricts.some(d => _matchesDistrict(b, d)));
  }
  if (isManager() || isCashier()) {
    const p = APP.profile || {};
    const target = p.branchId || p.branchCode || p.branchName;
    if (!target) return [];
    return APP.branches.filter(b =>
      b.id === target || b.code === target || b.name === target
    );
  }
  return [];
}

let _branchStatsCache = null;
function buildBranchStats() {
  if (_branchStatsCache) return _branchStatsCache;
  const counts = new Map();
  const members = new Map();
  APP.customers.forEach(c => {
    const keys = [c.branchId, c.branchCode, c.branch].filter(Boolean);
    keys.forEach(k => {
      counts.set(k, (counts.get(k) || 0) + 1);
      if (!members.has(k)) members.set(k, []);
      members.get(k).push(c);
    });
  });
  _branchStatsCache = { counts, members };
  return _branchStatsCache;
}
function customerCount(branch) {
  const { members } = buildBranchStats();
  const keys = [branch.id, branch.code, branch.name].filter(Boolean);
  const seen = new Set();
  let n = 0;
  for (const k of keys) {
    const list = members.get(k) || [];
    for (const c of list) {
      if (seen.has(c.id)) continue;
      seen.add(c.id);
      n++;
    }
  }
  return n;
}

const COUNTED_SAV_TX = ['approved','completed','paid','printed','done'];
function branchSavings(branch) {
  const { members } = buildBranchStats();
  const keys = [branch.id, branch.code, branch.name].filter(Boolean);
  const seen = new Set();
  const memberList = [];
  for (const k of keys) {
    const list = members.get(k) || [];
    for (const c of list) {
      if (seen.has(c.id)) continue;
      seen.add(c.id);
      memberList.push(c);
    }
  }
  let total = 0;
  memberList.forEach(c => {
    const idKeys = new Set([c.id, c.customerId, c.memberId, c.customerCode, c.memberCode].filter(Boolean));
    APP.transactions.forEach(tx => {
      const s = String(tx.status || '').toLowerCase();
      if (!COUNTED_SAV_TX.includes(s) && tx.printed !== true) return;
      const owns = idKeys.has(tx.customerId) || idKeys.has(tx.memberId)
                || idKeys.has(tx.customerDocId) || idKeys.has(tx.customerCode);
      if (!owns) return;
      const ty = String(tx.type || '').toLowerCase();
      if (ty === 'savings' || ty === 'deposit') total += num(tx.amount);
      else if (ty === 'withdrawal' || ty === 'leaving_withdrawal') total -= num(tx.amount);
    });
  });
  return Math.max(0, total);
}

function liveDistrictName(branch) {
  const d = APP.districts.find(x => x.id === branch.districtId);
  return d?.name || branch.districtName || '—';
}

/* ============================================================ FILTERS */
function filteredBranches() {
  let list = scopeBranches();
  const s = APP.filters.search.trim().toLowerCase();
  if (s) {
    list = list.filter(b =>
      (b.name || '').toLowerCase().includes(s) ||
      (b.code || '').toLowerCase().includes(s) ||
      (b.districtName || '').toLowerCase().includes(s) ||
      liveDistrictName(b).toLowerCase().includes(s) ||
      (b.notes || '').toLowerCase().includes(s)
    );
  }
  if (APP.filters.district) list = list.filter(b => b.districtId === APP.filters.district);
  return list.slice().sort((a, b) => {
    const ca = (a.code || '').toString();
    const cb = (b.code || '').toString();
    if (ca && cb) return ca.localeCompare(cb, undefined, { numeric: true });
    if (ca && !cb) return -1;
    if (!ca && cb) return 1;
    return (a.name || '').localeCompare(b.name || '');
  });
}

  });
  const s = document.getElementById('fltSearch');
  s?.addEventListener('input', debounce(() => {
    APP.filters.search = s.value;
    APP.page = 1;
    renderContent();
  }, 220));
  document.getElementById('fltDistrict')?.addEventListener('change', (e) => {
    APP.filters.district = e.target.value; APP.page = 1; renderContent();
  });
  document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => {
    APP.view = btn.dataset.view; APP.page = 1; renderMain();
  }));
}
let _debTimer;
function debounce(fn, ms) {
  return function (...args) {
    clearTimeout(_debTimer);
    _debTimer = setTimeout(() => fn.apply(this, args), ms);
  };
}
function handleRowAction(action, id) {
  const b = APP.branches.find(x => x.id === id);
  if (!b) return;
  if (action === 'edit')   { if (!canEdit()) { toast(t('noPermission'),'error'); return; } openBranchModal(b); }
  if (action === 'delete') { if (!canEdit()) { toast(t('noPermission'),'error'); return; } openDeleteModal(b); }
}

/* ============================================================ BRANCH MODAL */
function openBranchModal(branch) {
  closeModal('branchModal');
  APP.editingId = branch?.id || null;
  const isEdit = !!branch;
  const b = branch || {};

  const districts = assignableDistricts();
  if (!districts.length) { toast(t('noPermission'), 'error'); return; }
  const currentDistrictId = b.districtId || districts[0]?.id || '';

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="branchModal">
      <div class="modal modal--md">
        <div class="modal-head">
          <h3><i class="fas ${isEdit ? 'fa-pen' : 'fa-plus'}"></i>${esc(isEdit ? t('editBranch') : t('newBranch'))}</h3>
          <button class="modal-close" data-close="branchModal"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
          <form id="branchForm" autocomplete="off">
            <div class="form-grid">
              <div class="form-group full">
                <label for="bDistrict">${esc(t('districtLabel'))} <span class="req">*</span>
                  <span class="hint">${esc(t('districtHint'))}</span></label>
                <select id="bDistrict" ${isAdmin() || districts.length === 1 ? 'disabled' : ''} required>
                  ${districts.map(d => `<option value="${d.id}" ${currentDistrictId===d.id?'selected':''}>${esc(d.name || d.id)}</option>`).join('')}
                </select>
              </div>
              <div class="form-group full">
                <label for="bName">${esc(t('nameLabel'))} <span class="req">*</span>
                  <span class="hint">${esc(t('nameHint'))}</span></label>
                <input id="bName" type="text" placeholder="${esc(t('namePlaceholder'))}" value="${esc(b.name || '')}" required>
              </div>
              <div class="form-group full">
                <label for="bCode">${esc(t('codeLabel'))} <span class="req">*</span>
                  <span class="hint">${esc(t('codeHint'))}</span></label>
                <input id="bCode" type="text" class="code-input" placeholder="${esc(t('codePlaceholder'))}" value="${esc(b.code || '')}" required>
              </div>
              <div class="form-group full">
                <label for="bNotes">${esc(t('notesLabel'))}
                  <span class="hint">${esc(t('notesHint'))}</span></label>
                <textarea id="bNotes" placeholder="${esc(t('notesPlaceholder'))}">${esc(b.notes || '')}</textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-foot">
          <button class="btn btn--sm" data-close="branchModal">${esc(t('cancel'))}</button>
          <button class="btn btn--primary btn--sm" id="saveBranchBtn">
            <i class="fas fa-save"></i>${esc(isEdit ? t('update') : t('create'))}
          </button>
        </div>
      </div>
    </div>
  `);

  const modal = document.getElementById('branchModal');
  requestAnimationFrame(() => modal.classList.add('active'));
  modal.querySelectorAll('[data-close="branchModal"]').forEach(el =>
    el.addEventListener('click', () => closeModal('branchModal')));
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal('branchModal'); });

  const codeInput = document.getElementById('bCode');
  codeInput?.addEventListener('input', () => {
    let v = codeInput.value.toUpperCase();
    v = v.replace(/[^A-Z0-9-]/g, '');
    v = v.replace(/-+/g, '-');
    v = v.slice(0, 40);
    if (codeInput.value !== v) codeInput.value = v;
  });

  document.getElementById('saveBranchBtn')?.addEventListener('click', saveBranch);
  setTimeout(() => document.getElementById('bName')?.focus(), 100);
}

async function saveBranch() {
  const $ = (id) => document.getElementById(id);
  const districtId = $('bDistrict').value.trim();
  const name = $('bName').value.trim();
  const code = $('bCode').value.trim().toUpperCase();
  const notes = $('bNotes').value.trim();

  if (!districtId) { toast(t('noDistrictSelected'), 'warning'); return; }
  if (!name || !code) { toast(t('requiredFields'), 'warning'); return; }

  const dup = APP.branches.find(b =>
    (b.code || '').toString().toUpperCase() === code && b.id !== APP.editingId);
  if (dup) { toast(t('duplicateCode'), 'warning'); return; }

  if (!canEdit()) { toast(t('noPermission'), 'error'); return; }

  const saveBtn = $('saveBranchBtn');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + esc(t('loading')); }

  try {
    const districtName = APP.districts.find(d => d.id === districtId)?.name || '';
    const payload = { name, code, districtId, districtName, notes, updatedAt: serverTimestamp() };

    if (APP.editingId) {
      await updateDoc(doc(db, 'branches', APP.editingId), payload);
      toast(t('savedOk'), 'success');
    } else {
      payload.createdAt = serverTimestamp();
      const docId = /^[A-Za-z0-9_-]{1,60}$/.test(code) ? code : undefined;
      if (docId) {
        const ref = doc(db, 'branches', docId);
        const existing = await getDoc(ref);
        if (existing.exists()) {
          if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i class="fas fa-save"></i>' + esc(t('create')); }
          toast(t('duplicateCode'), 'error');
          return;
        }
        await setDoc(ref, payload);
      } else {
        await setDoc(doc(collection(db, 'branches')), payload);
      }
      toast(t('createdOk'), 'success');
    }
    closeModal('branchModal');
  } catch (e) {
    console.error('[saveBranch]', e);
    const msg = e.code === 'permission-denied' ? t('noPermission') : (e.message || 'Unknown error');
    toast(t('errorSave') + msg, 'error');
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i class="fas fa-save"></i> ' + esc(APP.editingId ? t('update') : t('create')); }
  }
}

/* ============================================================ DELETE */
function openDeleteModal(branch) {
  closeModal('deleteModal');
  if (!canEdit()) { toast(t('noPermission'), 'error'); return; }
  APP.deletingId = branch.id;
  const cc = customerCount(branch);
  const hasRefs = cc > 0;
  const dName = liveDistrictName(branch);

  const block = hasRefs ? `
    <div class="warn-banner" style="text-align:left;margin-top:14px">
      <i class="fas fa-exclamation-triangle"></i>
      <div>
        <strong>${esc(t('cannotDeleteText'))}</strong>
        <div style="margin-top:6px">${esc(t('hasCustomersWarning', { n: cc }))}</div>
      </div>
    </div>
    <label class="confirm-check">
      <input type="checkbox" id="forceDeleteCheck">
      <span>${t('forceDeleteLabel', { n: cc })}</span>
    </label>` : '';

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="deleteModal">
      <div class="modal">
        <div class="modal-icon danger"><i class="fas fa-trash"></i></div>
        <h3>${esc(t('deleteTitle'))}</h3>
        <p>${esc(t('deleteText'))}</p>
        <p style="font-weight:800;color:var(--text);margin-top:-8px;">
          ${esc(branch.name || '—')}
          ${branch.code ? ` <span style="color:var(--muted);font-weight:600;">(${esc(branch.code)})</span>` : ''}
        </p>
        ${dName !== '—' ? `
          <p style="font-size:12.5px;color:var(--muted);margin-top:-14px;margin-bottom:18px;">
            <i class="fas fa-map-marked-alt" style="margin-right:4px;"></i>${esc(dName)}
          </p>` : ''}
        ${block}
        <div class="modal-actions" style="margin-top:18px">
          <button class="btn btn--sm" data-close="deleteModal">${esc(t('cancel'))}</button>
          <button class="btn btn--danger btn--sm" id="confirmDeleteBtn" ${hasRefs ? 'disabled' : ''}>
            <i class="fas fa-trash"></i>${esc(t('rowDelete'))}
          </button>
        </div>
      </div>
    </div>
  `);

  const modal = document.getElementById('deleteModal');
  requestAnimationFrame(() => modal.classList.add('active'));
  modal.querySelectorAll('[data-close="deleteModal"]').forEach(el =>
    el.addEventListener('click', () => closeModal('deleteModal')));
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal('deleteModal'); });

  const check = document.getElementById('forceDeleteCheck');
  const btn = document.getElementById('confirmDeleteBtn');
  check?.addEventListener('change', () => { if (btn) btn.disabled = !check.checked; });

  btn?.addEventListener('click', async () => {
    if (hasRefs && !check?.checked) return;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + esc(t('loading'));
    try {
      await deleteDoc(doc(db, 'branches', APP.deletingId));
      toast(t('deletedOk'), 'success');
      closeModal('deleteModal');
    } catch (e) {
      const msg = e.code === 'permission-denied' ? t('noPermission') : e.message;
      toast(t('errorDelete') + msg, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-trash"></i> ' + esc(t('rowDelete'));
    }
  });
}

/* ============================================================ MODAL HELPERS */
function closeModal(id) {
  const m = document.getElementById(id);
  if (!m) return;
  m.classList.remove('active');
  setTimeout(() => { try { m.remove(); } catch(e){} }, 200);
  if (id === 'branchModal') APP.editingId = null;
  if (id === 'deleteModal') APP.deletingId = null;
}
function showLogoutModal() {
  closeModal('logoutModal');
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="logoutModal">
      <div class="modal">
        <div class="modal-icon danger"><i class="fas fa-sign-out-alt"></i></div>
        <h3>${esc(t('logoutTitle'))}</h3>
        <p>${esc(t('logoutText'))}</p>
        <div class="modal-actions">
          <button class="btn btn--sm" data-close="logoutModal">${esc(t('cancel'))}</button>
          <button class="btn btn--danger btn--sm" id="confirmLogoutBtn"><i class="fas fa-sign-out-alt"></i>${esc(t('logout'))}</button>
        </div>
      </div>
    </div>
  `);
  const modal = document.getElementById('logoutModal');
  requestAnimationFrame(() => modal.classList.add('active'));
  modal.querySelectorAll('[data-close="logoutModal"]').forEach(el =>
    el.addEventListener('click', () => closeModal('logoutModal')));
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal('logoutModal'); });
  document.getElementById('confirmLogoutBtn')?.addEventListener('click', async () => {
    if (awayCheckInterval) { clearInterval(awayCheckInterval); awayCheckInterval = null; }
    awayStartedAt = null;
    try { sessionStorage.clear(); } catch(e){}
    try { await signOut(auth); } catch(e){}
    window.location.replace(LOGIN_URL);
  });
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') ['branchModal','deleteModal','logoutModal'].forEach(closeModal);
});

/* ============================================================ LANGUAGE */
function setLang(lang) {
  if (!SUPPORTED.includes(lang)) lang = FALLBACK;
  LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  document.documentElement.lang = lang;
  document.body.classList.toggle('lang-am', lang === 'am');
  renderShell();
  renderMain();
}

/* ============================================================ LISTENERS */
function attachListeners() {
  stopListeners();
  const watch = (coll, key, orderField) => {
    let ref = collection(db, coll);
    if (orderField) ref = query(ref, orderBy(orderField, 'desc'), limit(500));
    const unsub = onSnapshot(ref,
      (snap) => {
        APP[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (key === 'customers' || key === 'branches' || key === 'transactions') {
          _branchStatsCache = null;
        }
        renderMain();
      },
      (err) => { console.warn('[listen]', coll, err.code, err.message); renderMain(); }
    );
    APP.unsubs.push(unsub);
  };
  watch('districts',    'districts');
  watch('branches',     'branches');
  watch('customers',    'customers');
  watch('transactions', 'transactions', 'createdAt');
}
function stopListeners() {
  APP.unsubs.forEach(u => { try { u(); } catch(e){} });
  APP.unsubs = [];
}

/* ============================================================ BOOT */
(async function boot() {
  let saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch(e){}
  const b = (navigator.language || 'en').slice(0,2);
  LANG = SUPPORTED.includes(saved) ? saved : (SUPPORTED.includes(b) ? b : 'en');
  document.documentElement.lang = LANG;
  document.body.classList.toggle('lang-am', LANG === 'am');

  const sess = readSession();
  if (!isSessionRecordValid(sess)) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  const user = await new Promise((resolve) => {
    const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
  });
  if (!user || user.uid !== sess.uid) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession();
    window.location.replace(LOGIN_URL);
    return;
  }
  APP.user = user;

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) throw new Error('no-user-doc');
    APP.profile = { id: snap.id, ...snap.data(), email: user.email || '' };
    if (APP.profile.status === 'inactive') throw new Error('inactive');
  } catch (e) {
    try { sessionStorage.setItem('__redirectReason', 'expired'); } catch(e){}
    clearSession();
    try { await signOut(auth); } catch(e){}
    window.location.replace(LOGIN_URL);
    return;
  }

  await loadSessionTimeout();

  // Sacco name from settings
  try {
    const cfg = await getDoc(doc(db, 'settings', 'system'));
    if (cfg.exists()) {
      const dd = cfg.data();
      if (dd.saccoName && String(dd.saccoName).trim()) APP.saccoName = String(dd.saccoName).trim();
      if (dd.shortName && String(dd.shortName).trim()) APP.shortName = String(dd.shortName).trim();
    }
  } catch(e){}

  renderShell();
  renderMain();
  setTimeout(() => document.getElementById('loader')?.classList.add('hide'), 150);
  attachListeners();
  startSessionWatcher();
})();

console.log('[sacco] branches page ready — silent session, no countdown UI');
